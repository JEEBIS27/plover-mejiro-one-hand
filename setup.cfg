[metadata]
name = Mejiro-One-Hand
version = 0.0.0
description = Japanese stenography for Plover
long_description = file: README.md
long_description_content_type = text/markdown
author = JEEBIS27
author_email = jeebis.iox@gmail.com
license = GPL-3.0-or-later
url =https://github.com/JEEBIS27/Plover_Mejiro/tree/one-hand
project_urls =
	Source Code = https://github.com/JEEBIS27/Plover_Mejiro/tree/one-hand
	Issue Tracker = https://github.com/JEEBIS27/Plover_Mejiro/issues
keywords = plover plover_plugin

[options]
zip_safe = True
setup_requires =
	setuptools>=30.3.0
install_requires =
        plover>=5.2.3
		plover-system-switcher
		plover-last-translation
   		plover-python-dictionary
packages =
	Mejiro-One-Hand
	Mejiro-One-Hand.dictionaries.default

[options.entry_points]
plover.system =
 Mejiro-One-Hand = Mejiro-One-Hand.system

[options.exclude_package_data]
Mejiro-One-Hand.dictionaries =
    default/*
